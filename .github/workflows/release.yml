name: Release
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-run the release for (e.g. v0.7.0)"
        required: true
        type: string
env:
  CARGO_TERM_COLOR: always
permissions:
  contents: write
  pull-requests: write
jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      # A tag push supplies github.ref_name; a manual re-run supplies inputs.tag.
      - name: Resolve tag and version
        id: get_version
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF_NAME}}"
          case "${TAG}" in
            v*.*.*) ;;
            *) echo "Expected a vX.Y.Z tag, got '${TAG}'" >&2; exit 1 ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build-release:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (glibc)
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          # Linux x86_64 (musl, static)
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # Linux aarch64 (glibc)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # Linux aarch64 (musl, static)
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          # macOS x86_64
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          # macOS aarch64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache: true
      - name: Install cross (for cross-compilation)
        if: matrix.cross
        run: cargo install cross
      - name: Build release binary
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash
      - name: Prepare binary (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release

          BINARY_NAME="terragrunt-dag"
          if [ -f "${BINARY_NAME}" ]; then
            strip "${BINARY_NAME}" 2>/dev/null || true
            cp "${GITHUB_WORKSPACE}/LICENSE" "${GITHUB_WORKSPACE}/README.md" .
            tar czf "../../../terragrunt-dag-v${{ needs.create-release.outputs.version }}-${{ matrix.target }}.tar.gz" "${BINARY_NAME}" LICENSE README.md
            cd ../../..
            shasum -a 256 "terragrunt-dag-v${{ needs.create-release.outputs.version }}-${{ matrix.target }}.tar.gz" > "terragrunt-dag-v${{ needs.create-release.outputs.version }}-${{ matrix.target }}.tar.gz.sha256"
          fi
        shell: bash
      - name: Upload release archive
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            terragrunt-dag-v${{ needs.create-release.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
            terragrunt-dag-v${{ needs.create-release.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Stash archive for checksums job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: archive-${{ matrix.target }}
          path: terragrunt-dag-v${{ needs.create-release.outputs.version }}-${{ matrix.target }}.${{ matrix.archive }}
          retention-days: 1
  checksums:
    name: Generate SHA256SUMS
    runs-on: ubuntu-latest
    needs: build-release
    steps:
      - name: Download all release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: archive-*
          path: archives
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd archives
          sha256sum *.tar.gz > ../SHA256SUMS
          cd ..
          cat SHA256SUMS
      - name: Upload SHA256SUMS to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # Publishing lives here rather than in a workflow keyed on `release:
  # published`. Releases are created with GITHUB_TOKEN, and GitHub suppresses
  # workflow triggers for events that token raises, so such a workflow never
  # runs. Keeping it in this job graph also guarantees the crate is only
  # published once every platform binary and the checksum file are in place.
  publish-crate:
    name: Publish to crates.io
    needs: [create-release, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.create-release.outputs.tag }}
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: true
      - name: Verify tag matches Cargo.toml version
        run: |
          CRATE_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "${TAG_VERSION}" != "${CRATE_VERSION}" ]; then
            echo "Tag version (${TAG_VERSION}) does not match Cargo.toml version (${CRATE_VERSION})" >&2
            exit 1
          fi
        env:
          TAG_VERSION: ${{ needs.create-release.outputs.version }}
        shell: bash
      # Makes a re-run idempotent: crates.io rejects a duplicate version, which
      # would otherwise fail the whole release.
      - name: Check whether the version is already published
        id: published
        run: |
          CODE="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H 'User-Agent: terragrunt-dag-release-workflow' \
            "https://crates.io/api/v1/crates/terragrunt-dag/${TAG_VERSION}")"
          if [ "${CODE}" = "200" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "terragrunt-dag ${TAG_VERSION} is already on crates.io; skipping publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TAG_VERSION: ${{ needs.create-release.outputs.version }}
        shell: bash
      - name: Publish to crates.io
        if: steps.published.outputs.already == 'false'
        run: cargo publish --locked --token "${CRATES_IO_TOKEN}"
        env:
          CRATES_IO_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
